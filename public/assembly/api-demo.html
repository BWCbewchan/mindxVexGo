<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>AI API · Khung xe bốn bánh</title><style>html,body{margin:0;height:100%;background:#272a2e;font:14px system-ui;color:white}header{height:40px;display:flex;align-items:center;gap:20px;padding:0 16px}iframe{width:100%;height:calc(100% - 40px);border:0}#progress{color:#b6d5ef}</style></head><body><header><b>AI API · Khung xe bốn bánh</b><span id="progress">Đang mở Assembly…</span></header><iframe src="editor.html?demo=api-cart" title="Assembly API demo"></iframe><script type="module">
const frame=document.querySelector('iframe'),status=document.getElementById('progress');
async function run(){try{while(!frame.contentWindow.mindxAssembly)await new Promise(r=>setTimeout(r,100));const api=frame.contentWindow.mindxAssembly;let state=await api.execute('getState');if(state.result.project.parts.length){status.textContent='Mô hình demo đã lưu · không ảnh hưởng bản đang lắp';return;}
let n=0;async function call(command,args){status.textContent=`API ${++n}: ${command}`;const result=await api.execute(command,args);if(!result.ok)throw Error(command+' '+JSON.stringify(args)+' '+result.error);return result.result;}
const beam=await call('addPart',{sku:'228-2500-023',position:[0,30,0],rotation:[90,0,0]});
for(const hole of ['5','41']){const shaft=await call('addPart',{sku:'228-2500-124',position:[n*60,150,100]});await call('attach',{id:shaft.id,targetId:beam.id,sourceRef:'square-shaft-end-a',targetRef:hole,depth:49.911});for(const end of ['square-shaft-end-a','square-shaft-end-b']){const wheel=await call('addPart',{sku:'228-2500-1383',position:[n*60,220,100]});await call('attach',{id:wheel.id,targetId:shaft.id,sourceRef:'square-hole-front',targetRef:end,depth:10});const collar=await call('addPart',{sku:'228-2500-143',position:[n*60,300,100]});await call('attach',{id:collar.id,targetId:shaft.id,sourceRef:'square-hole-front',targetRef:end,depth:3});}}
const fit=await call('checkFit');await call('select',{ids:[beam.id]});frame.contentDocument.getElementById('fit').click();status.textContent=`Hoàn thành bằng ${n} lệnh API · 11 chi tiết · ${fit.issues.filter(i=>i.kind==='penetration').length} va chạm xuyên thân`;window.demoReady=true;
}catch(e){status.textContent='Lỗi API: '+e.message;window.demoError=e.message;}}
frame.addEventListener('load',run);
</script></body></html>
